schema_version = "1.0.0"

id = "io_scene_foundry"
version = "2.0.0"
name = "Foundry"
tagline = "An import and export pipeline for the Halo: The Masterchief Collection games"
maintainer = "Crisp"
type = "add-on"

website = "https://c20.reclaimers.net/general/community-tools/foundry/"

tags = ["Import-Export", "Pipeline"]

blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]

wheels = [
  "./wheels/coacd-1.0.11-cp39-abi3-win_amd64.whl",
  "./wheels/blam_tags-0.1.10-cp38-abi3-win_amd64.whl"
]

[permissions]
files = "Import and export Halo tags and asset files"
clipboard = "Copy tag paths and asset references"

[build]
paths_exclude_pattern = [
  "/.git/",
  "__pycache__/"
]
