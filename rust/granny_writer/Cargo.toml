[package]
name = "foundry-granny"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Independent Granny GR2 writer for Foundry"

[lib]
name = "foundry_granny"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29.2", features = ["extension-module", "abi3-py311"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
crc32fast = "=1.5.2"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
